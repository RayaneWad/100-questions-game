<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Our Date</title>

  <style>
    :root {
      --accent: #ff7090;
      --accent-2: #ff93b5;
      --text: #3a1f2f;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #fff0f7 0%, #ffdce7 35%, #ffe6f2 100%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .scene-stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px 18px;
    }

    /* 16:9 box so the whole photo always shows — no cropping on any screen shape */
    .scene-image-card {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(160deg, #3a2029 0%, #1a0f14 100%);
      box-shadow: 0 18px 40px rgba(255, 112, 144, 0.22);
    }

    .scene-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    .scene-image.visible {
      opacity: 1;
    }

    /* Placeholder shown when an image is missing, so the flow still works before real photos are added */
    .scene-image-card::before {
      content: '📷 Add "' attr(data-filename) '" to the assets folder';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.55);
      z-index: 0;
    }

    .scene-image {
      z-index: 1;
    }

    .scene-caption {
      max-width: 560px;
      width: 100%;
      text-align: center;
      font-size: clamp(1.05rem, 4vw, 1.5rem);
      line-height: 1.5;
      color: #61314a;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease 0.15s, transform 0.6s ease 0.15s;
    }

    .scene-caption.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .dots {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 112, 144, 0.28);
      transition: all 0.3s ease;
    }

    .dot.active {
      background: var(--accent);
      width: 22px;
      border-radius: 999px;
    }

    .next-btn {
      background: linear-gradient(135deg, #ff7fa0, #ff4e8a);
      border: none;
      color: white;
      padding: 15px 30px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(255, 82, 141, 0.32);
      transition: transform 0.18s ease;
      width: 100%;
      max-width: 320px;
    }

    .next-btn:hover {
      transform: translateY(-2px);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    .skip-hint {
      font-size: 0.8rem;
      color: #a3667c;
    }

    @media (max-width: 600px) {
      .skip-hint {
        display: none;
      }
    }

    @media (max-height: 560px) {
      .scene-stage {
        justify-content: flex-start;
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>
  <div class="scene-stage" id="stage">
    <div class="scene-image-card" id="imageCard">
      <img class="scene-image" id="sceneImage" alt="" />
    </div>

    <p class="scene-caption" id="sceneCaption"></p>
    <div class="dots" id="dots"></div>
    <button class="next-btn" id="nextBtn">Next →</button>
    <div class="skip-hint">press → to continue</div>
  </div>

  <script>
    // Add your own photos (16:9 format) to the assets folder.
    // Each scene = 1 image + 1 caption. Feel free to add more "on the way" scenes in between.
    const scenes = [
      {
        image: 'assets/date-1-start.png',
        caption: 'Our date begins...'
      },
      {
        image: 'assets/date-2-walk.png',
        caption: 'On our way to our spots..'
      },
      {
        image: 'assets/date-3-walk.png',
        caption: 'A little further, walking together.'
      },
      {
        image: 'assets/date-4-together.png',
        caption: 'And there we are, finally together.'
      }
    ];

    const finalButtonLabel = 'Time to talk 💬';
    const finalButtonHref = 'questions.html';

    const sceneImage = document.getElementById('sceneImage');
    const imageCard = document.getElementById('imageCard');
    const sceneCaption = document.getElementById('sceneCaption');
    const nextBtn = document.getElementById('nextBtn');
    const dotsEl = document.getElementById('dots');

    let current = 0;

    function buildDots() {
      dotsEl.innerHTML = '';
      scenes.forEach(() => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dotsEl.appendChild(dot);
      });
    }

    function updateDots() {
      dotsEl.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
      });
    }

    function renderScene() {
      const scene = scenes[current];
      const filename = scene.image.split('/').pop();

      sceneImage.classList.remove('visible');
      sceneCaption.classList.remove('visible');
      imageCard.setAttribute('data-filename', filename);

      // Small delay so the fade-out plays before swapping the image/caption
      setTimeout(() => {
        sceneImage.src = scene.image;
        sceneCaption.textContent = scene.caption;
        requestAnimationFrame(() => {
          sceneImage.classList.add('visible');
          sceneCaption.classList.add('visible');
        });
      }, 200);

      updateDots();

      const isLast = current === scenes.length - 1;
      nextBtn.textContent = isLast ? finalButtonLabel : 'Next →';
    }

    function goNext() {
      const isLast = current === scenes.length - 1;
      if (isLast) {
        window.location.href = finalButtonHref;
        return;
      }
      current += 1;
      renderScene();
    }

    nextBtn.addEventListener('click', goNext);
    imageCard.addEventListener('click', goNext);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        goNext();
      }
    });

    buildDots();
    renderScene();
  </script>
</body>
</html>
